name: Build and Deploy APT Repository

on:
  workflow_dispatch: # 手動実行用
  push:
    branches:
      - main # mainブランチ更新時に実行

jobs:
  build-repo:
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh-pages ブランチへの書き込み権限

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install APT tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev

      - name: Download .deb files from Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p deb-packages
          # OpenRTM-aist の v2.1.0 リリースから .deb ファイルを一時的にダウンロード
          gh release download v2.1.0 \
            --repo OpenRTM/OpenRTM-aist \
            --pattern "*.deb" \
            --dir deb-packages

      - name: Generate APT Repository Structure (Metadata Only)
        run: |
          ARCH_DIR="public/dists/noble/main/binary-amd64"
          mkdir -p "$ARCH_DIR"

          # 一時ディレクトリで Packages メタデータを生成
          dpkg-scanpackages deb-packages /dev/null > Packages.tmp

          # Filename 行を GitHub Releases の直リンク URL (https://...) に書き換えて公開用ディレクトリへ出力
          # ※ deb-packages/filename.deb -> https://github.com/OpenRTM/OpenRTM-aist/releases/download/v2.1.0/filename.deb
          RELEASE_URL="https://github.com/OpenRTM/OpenRTM-aist/releases/download/v2.1.0"
          
          sed "s|Filename: deb-packages/|Filename: $RELEASE_URL/|g" Packages.tmp > "$ARCH_DIR/Packages"

          # 圧縮版 Packages.gz の作成
          gzip -k -f "$ARCH_DIR/Packages"

          # Release ファイルの簡易生成
          cat <<EOF > "$ARCH_DIR/Release"
          Archive: noble
          Component: main
          Origin: OpenRTM
          Label: OpenRTM Repository
          Architecture: amd64
          EOF

          # 後始末（public ディレクトリに .deb ファイルが含まれないことを保証）
          rm -f Packages.tmp

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
